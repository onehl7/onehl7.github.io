<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Fiber optic cable types and strand counts</title>
  <desc id="desc">Comparison of single-mode fiber, multi-mode fiber, and examples of cable counts with different numbers of cores.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7fbff"/>
      <stop offset="100%" stop-color="#edf3ff"/>
    </linearGradient>
    <linearGradient id="single" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#89d2ff"/>
      <stop offset="100%" stop-color="#4e9af9"/>
    </linearGradient>
    <linearGradient id="multi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d7f7c0"/>
      <stop offset="100%" stop-color="#76c67b"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="700" fill="url(#bg2)"/>
  <text x="600" y="70" text-anchor="middle" font-size="34" font-weight="700" fill="#1f2a44">Fiber types and cable configurations</text>

  <g transform="translate(90,140)">
    <rect x="0" y="0" width="480" height="250" rx="24" fill="#ffffff" stroke="#cfe0f7" stroke-width="3"/>
    <text x="240" y="40" text-anchor="middle" font-size="28" font-weight="700" fill="#1e2f4d">Single-mode fiber</text>
    <circle cx="120" cy="120" r="62" fill="url(#single)"/>
    <circle cx="120" cy="120" r="16" fill="#ffffff"/>
    <text x="260" y="110" font-size="22" fill="#213857">Very small core</text>
    <text x="260" y="142" font-size="22" fill="#213857">One light path</text>
    <text x="260" y="174" font-size="22" fill="#213857">Best for long-distance links</text>
    <text x="260" y="206" font-size="22" fill="#213857">Common in telecom backbones</text>

    <rect x="560" y="0" width="480" height="250" rx="24" fill="#ffffff" stroke="#cfe0f7" stroke-width="3"/>
    <text x="800" y="40" text-anchor="middle" font-size="28" font-weight="700" fill="#1e2f4d">Multi-mode fiber</text>
    <circle cx="670" cy="120" r="62" fill="url(#multi)"/>
    <circle cx="670" cy="120" r="22" fill="#f7fff7" stroke="#589c5d" stroke-width="3"/>
    <text x="760" y="110" font-size="22" fill="#213857">Larger core</text>
    <text x="760" y="142" font-size="22" fill="#213857">Multiple light paths</text>
    <text x="760" y="174" font-size="22" fill="#213857">Shorter reach</text>
    <text x="760" y="206" font-size="22" fill="#213857">Typical in data centers</text>
  </g>

  <g transform="translate(130,430)">
    <rect x="0" y="0" width="940" height="180" rx="24" fill="#ffffff" stroke="#cfe0f7" stroke-width="3"/>
    <text x="470" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#1e2f4d">Cable examples: different numbers of cores</text>

    <g transform="translate(60,60)">
      <rect x="0" y="0" width="140" height="80" rx="16" fill="#dfeeff"/>
      <circle cx="28" cy="40" r="16" fill="#4a9ef3"/>
      <text x="62" y="46" font-size="22" fill="#1f2a44">1 core</text>
    </g>

    <g transform="translate(240,60)">
      <rect x="0" y="0" width="140" height="80" rx="16" fill="#dfeeff"/>
      <circle cx="28" cy="40" r="16" fill="#4a9ef3"/>
      <circle cx="70" cy="40" r="16" fill="#4a9ef3"/>
      <text x="96" y="46" font-size="22" fill="#1f2a44">2 cores</text>
    </g>

    <g transform="translate(420,60)">
      <rect x="0" y="0" width="140" height="80" rx="16" fill="#dfeeff"/>
      <circle cx="20" cy="40" r="14" fill="#4a9ef3"/>
      <circle cx="50" cy="40" r="14" fill="#4a9ef3"/>
      <circle cx="80" cy="40" r="14" fill="#4a9ef3"/>
      <text x="104" y="46" font-size="22" fill="#1f2a44">3 cores</text>
    </g>

    <g transform="translate(600,60)">
      <rect x="0" y="0" width="140" height="80" rx="16" fill="#dfeeff"/>
      <circle cx="18" cy="40" r="12" fill="#4a9ef3"/>
      <circle cx="42" cy="40" r="12" fill="#4a9ef3"/>
      <circle cx="66" cy="40" r="12" fill="#4a9ef3"/>
      <circle cx="90" cy="40" r="12" fill="#4a9ef3"/>
      <text x="112" y="46" font-size="22" fill="#1f2a44">4 cores</text>
    </g>

    <g transform="translate(780,60)">
      <rect x="0" y="0" width="140" height="80" rx="16" fill="#dfeeff"/>
      <circle cx="18" cy="40" r="12" fill="#4a9ef3"/>
      <circle cx="38" cy="40" r="12" fill="#4a9ef3"/>
      <circle cx="58" cy="40" r="12" fill="#4a9ef3"/>
      <circle cx="78" cy="40" r="12" fill="#4a9ef3"/>
      <circle cx="98" cy="40" r="12" fill="#4a9ef3"/>
      <text x="120" y="46" font-size="22" fill="#1f2a44">5 cores</text>
    </g>
  </g>
</svg>
