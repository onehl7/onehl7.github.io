<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | {{ site.title }}</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>

  <script>
    (function() {
      const storedTheme = localStorage.getItem('theme');
      const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = storedTheme ? storedTheme : (systemPrefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  {% include navigation.html %}
  <main class="post-shell">
    <article>
      <header class="post-header motion-in">
        {% if page.categories.size > 0 %}
        <p class="eyebrow">{{ page.categories | join: " · " }}</p>
        {% endif %}
        {% assign title_length = page.title | size %}
        <h1 class="card-heading{% if title_length > 30 %} post-title-compact{% endif %}">{{ page.title }}</h1>
        <p class="post-meta">{{ page.date | date: "%B %d, %Y" }}</p>
      </header>

      {% if page.image %}
      <div class="post-cover motion-in">
        <img src="{{ page.image | relative_url }}" alt="{{ page.title }}">
      </div>
      {% endif %}

      <div class="prose prose-lg post-content">
        {{ content }}
      </div>
    </article>
  </main>
  {% include footer.html %}
</body>
</html>
